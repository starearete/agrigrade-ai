crop_name: "tomato"
description: "Tomato produce dataset for valid produce crop classification."

dataset_sources:
  zip_archives: []
  extracted_directories:
    - "Tomato-144"

supported_tasks:
  classification:
    description: "Binary/crop validation classification (tomato vs non-crop)"
    classes:
      - "tomato"
    ground_truth: true
    requires_manual_verification: false
    ready_for_training: true
    total_images: 144

  maturity:
    description: "Tomato ripening stage classification"
    classes: []
    ground_truth: false
    requires_manual_verification: true
    ready_for_training: false
    notes: "Requires dedicated tomato ripening stage dataset."

recommended_split:
  train: 0.70
  validation: 0.15
  test: 0.15

data_cleaning:
  deduplicate_by_sha256: true
  remove_corrupted: true
