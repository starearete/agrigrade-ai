crop_name: "carrot"
description: "Carrot produce dataset for valid produce crop classification."

dataset_sources:
  zip_archives: []
  extracted_directories:
    - "Carrots-168"

supported_tasks:
  classification:
    description: "Binary/crop validation classification (carrot vs non-crop)"
    classes:
      - "carrot"
    ground_truth: true
    requires_manual_verification: false
    ready_for_training: true
    total_images: 168

  defects:
    description: "Physical defect classification (cracks, breakage, misshapen)"
    classes: []
    ground_truth: false
    requires_manual_verification: true
    ready_for_training: false
    notes: "Requires dedicated defect annotation pass."

recommended_split:
  train: 0.70
  validation: 0.15
  test: 0.15

data_cleaning:
  deduplicate_by_sha256: true
  remove_corrupted: true
